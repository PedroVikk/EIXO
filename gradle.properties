# Sem -Dfile.encoding=UTF-8 aqui de propósito: no Windows, com acento no caminho do usuário
# (ex.: C:\Users\Fulano Teó), essa opção corrompe o classpath dos testes. O código-fonte
# continua compilado em UTF-8 — Kotlin e AGP já usam UTF-8 por padrão.
org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
